[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orn-g4"
version = "0.1.0"
description = "Ornith G4 deterministic ternary quantization, recovery, and canonical safetensors tooling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "safetensors>=0.4.0",
    "pyarrow>=14.0.0",
    "transformers>=4.45.0",
    "accelerate>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["orn_g4*"]
